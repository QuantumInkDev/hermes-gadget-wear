name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 ndk;27.1.12297006'
          accept-android-sdk-licenses: false
      - name: Install pinned SDK development server
        run: python3 tools/setup-devserver.py
      - name: Build, test, lint, and format check
        run: HERMES_GADGET_PYTHON="$PWD/.local/venv/bin/python" ./gradlew check :wear:assembleDebug :wear:assembleDebugAndroidTest :mobile:assembleDebug --warning-mode=fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apps
          path: |
            wear/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk
          retention-days: 7

  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare isolated pinned SDK patch series
        run: python3 tools/setup-extensions.py
      - name: Test optional codecs and stock compatibility
        run: HERMES_AGENT_DIR="$PWD/.local/unavailable" .local/extension-venv/bin/python -m pytest .local/upstream/hermes-gadget-sdk-patched/tests/test_opus.py .local/upstream/hermes-gadget-sdk-patched/tests/test_protocol.py .local/upstream/hermes-gadget-sdk-patched/tests/test_plugin_units.py -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
